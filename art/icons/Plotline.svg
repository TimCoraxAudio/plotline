<!-- Plotline add-on icon: minimap button, Journal portrait, add-on list. Original art, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#2f5d70"/>
      <stop offset=".5" stop-color="#15303f"/>
      <stop offset="1" stop-color="#04090d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2a1a"/>
      <stop offset="1" stop-color="#330904"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfae6c"/>
      <stop offset=".75" stop-color="#f6e8c4"/>
      <stop offset="1" stop-color="#b8935a"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8935a"/>
      <stop offset=".25" stop-color="#f6e8c4"/>
      <stop offset="1" stop-color="#cfae6c"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#e0a020"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" fill="url(#bg)"/>
  <ellipse cx="34" cy="22" rx="24" ry="20" fill="url(#glow)"/>

  <g transform="translate(32 40) scale(.9) translate(-32 -40)">
    <!-- cover -->
    <path d="M4,28 C12,25 24,25 32,29 C40,25 52,25 60,28 L60,54 C52,51 40,51 32,55 C24,51 12,51 4,54 Z"
          fill="url(#cover)" stroke="#1a0603" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- pages -->
    <path d="M32,28 C24,23 14,23 7,26 L7,50 C14,47 24,47 32,52 Z" fill="url(#pageL)" stroke="#4a2c10" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M32,28 C40,23 50,23 57,26 L57,50 C50,47 40,47 32,52 Z" fill="url(#pageR)" stroke="#4a2c10" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M32,28 L32,52" stroke="#6a4418" stroke-width="1.2"/>
    <!-- script lines -->
    <g fill="none" stroke="#6b4a22" stroke-opacity=".45" stroke-width="1" stroke-linecap="round">
      <path d="M11,31 C16,29.5 22,29.5 28,31.5"/>
      <path d="M11,35 C16,33.5 22,33.5 28,35.5"/>
      <path d="M11,39 C16,37.5 22,37.5 28,39.5"/>
      <path d="M11,43 C15,41.8 19,41.8 22,42.6"/>
      <path d="M36,31.5 C42,29.5 48,29.5 53,31"/>
      <path d="M36,35.5 C42,33.5 48,33.5 53,35"/>
      <path d="M36,39.5 C42,37.5 48,37.5 53,39"/>
      <path d="M36,43.5 C42,41.5 48,41.5 53,43"/>
    </g>
  </g>

  <!-- the plotline: a thread that leaves the page and climbs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="thread" d="M18,40 C23,36 28,38 32,32 C36,26 45,26 44,18 C43,11 36,11 34,7"
          stroke="#ffcf5a" stroke-opacity=".16" stroke-width="6"/>
    <path d="M18,40 C23,36 28,38 32,32 C36,26 45,26 44,18 C43,11 36,11 34,7"
          stroke="#ffcf5a" stroke-opacity=".35" stroke-width="3.4"/>
    <path d="M18,40 C23,36 28,38 32,32 C36,26 45,26 44,18 C43,11 36,11 34,7"
          stroke="#4a2a06" stroke-opacity=".7" stroke-width="2.6"/>
    <path d="M18,40 C23,36 28,38 32,32 C36,26 45,26 44,18 C43,11 36,11 34,7"
          stroke="#ffe7a0" stroke-width="1.5"/>
  </g>
  <!-- steps along it -->
  <g stroke="#3a2004" stroke-width="1">
    <circle cx="18" cy="40" r="2.4" fill="#d9a43a"/>
    <circle cx="32" cy="32" r="2.6" fill="#e8b84a"/>
    <circle cx="44" cy="18" r="2.8" fill="#f6cc5c"/>
  </g>
  <!-- the step ahead: a spark, not yet known -->
  <circle cx="34" cy="7" r="5" fill="url(#glow)"/>
  <path d="M34,1.5 L35.3,5.7 L39.5,7 L35.3,8.3 L34,12.5 L32.7,8.3 L28.5,7 L32.7,5.7 Z"
        fill="url(#star)" stroke="#6a4006" stroke-width=".6" stroke-linejoin="round"/>
</svg>
