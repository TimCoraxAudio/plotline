<!-- Tier glyph: Chain (multi-step but mechanical). Two linked rings. GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d8dde4"/><stop offset="1" stop-color="#8a929c"/>
    </linearGradient>
    <rect id="a" x="2.5" y="11" width="16" height="10" rx="5"/>
    <rect id="b" x="13.5" y="11" width="16" height="10" rx="5"/>
    <clipPath id="over"><rect x="12" y="0" width="10" height="16"/></clipPath>
  </defs>
  <g transform="rotate(-40 16 16)" fill="none">
    <use xlink:href="#a" stroke="#111" stroke-width="6"/>
    <use xlink:href="#a" stroke="url(#g)" stroke-width="3"/>
    <use xlink:href="#b" stroke="#111" stroke-width="6"/>
    <use xlink:href="#b" stroke="url(#g)" stroke-width="3"/>
    <g clip-path="url(#over)">
      <use xlink:href="#a" stroke="#111" stroke-width="6"/>
      <use xlink:href="#a" stroke="url(#g)" stroke-width="3"/>
    </g>
  </g>
</svg>
