<!-- Chain badge for the quest dialog's top-right corner. The "3/7" text is a FontString drawn on top.
     Original art, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe08e"/>
      <stop offset=".45" stop-color="#c08a34"/>
      <stop offset="1" stop-color="#4a2c0c"/>
    </linearGradient>
    <radialGradient id="inner" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3e2a14"/>
      <stop offset="1" stop-color="#110803"/>
    </radialGradient>
    <linearGradient id="rivet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2c0"/>
      <stop offset="1" stop-color="#7a5418"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30.5" fill="#120802"/>
  <circle cx="32" cy="32" r="29" fill="url(#ring)"/>
  <circle cx="32" cy="32" r="22.5" fill="#1c0f04"/>
  <circle cx="32" cy="32" r="21.5" fill="url(#inner)"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#f3c95e" stroke-opacity=".45" stroke-width=".8"/>
  <path d="M10.5,26 A22,22 0 0 1 53.5,26" fill="none" stroke="#fff6d8" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>
  <g fill="url(#rivet)" stroke="#2a1804" stroke-width=".5">
    <circle cx="32" cy="6.3" r="1.6"/><circle cx="57.7" cy="32" r="1.6"/>
    <circle cx="32" cy="57.7" r="1.6"/><circle cx="6.3" cy="32" r="1.6"/>
    <circle cx="50.2" cy="13.8" r="1.3"/><circle cx="50.2" cy="50.2" r="1.3"/>
    <circle cx="13.8" cy="50.2" r="1.3"/><circle cx="13.8" cy="13.8" r="1.3"/>
  </g>
</svg>
