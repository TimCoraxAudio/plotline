<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c0"/><stop offset="0.35" stop-color="#ffd34a"/><stop offset="0.7" stop-color="#e09a10"/><stop offset="1" stop-color="#8a4a00"/></linearGradient>
<radialGradient id="enamel" cx="50%" cy="35%" r="50%"><stop offset="0" stop-color="#3d74c4"/><stop offset="1" stop-color="#081a40"/></radialGradient>
<filter id="bevel" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="2.2" diffuseConstant="1.2" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
 <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" result="sh"/>
 <feSpecularLighting in="b" surfaceScale="2.2" specularConstant="0.9" specularExponent="20" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="38"/></feSpecularLighting>
 <feComposite in="sh" in2="s" operator="arithmetic" k2="1" k3="1" result="l"/>
 <feComposite in="l" in2="SourceAlpha" operator="in"/>
</filter>
</defs>

<circle cx="16" cy="16" r="15" fill="#0a0500"/>
<g filter="url(#bevel)"><path d="M16,2.5 A13.5,13.5 0 1 1 15.99,2.5 Z M16,6.5 A9.5,9.5 0 1 0 16.01,6.5 Z" fill="url(#gold)" fill-rule="evenodd"/></g>
<circle cx="16" cy="16" r="9.5" fill="url(#enamel)" stroke="#0a0500" stroke-width=".8"/>
<path d="M16,8.5 L17.6,14.4 L23.5,16 L17.6,17.6 L16,23.5 L14.4,17.6 L8.5,16 L14.4,14.4 Z" fill="#0a0500" stroke="#0a0500" stroke-width="1.6" stroke-linejoin="round"/>
<g filter="url(#bevel)"><path d="M16,8.5 L17.6,14.4 L23.5,16 L17.6,17.6 L16,23.5 L14.4,17.6 L8.5,16 L14.4,14.4 Z" fill="url(#gold)"/></g>
