<!-- Gilded tier: Lore. An eight-pointed star. Original art, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c0"/><stop offset="0.4" stop-color="#ffa21e"/><stop offset="1" stop-color="#9a3c00"/></linearGradient>
<filter id="bevel" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="0.9" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="2.6" diffuseConstant="1.2" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
 <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" result="sh"/>
 <feSpecularLighting in="b" surfaceScale="2.6" specularConstant="0.9" specularExponent="22" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="38"/></feSpecularLighting>
 <feComposite in="sh" in2="s" operator="arithmetic" k2="1" k3="1" result="l"/>
 <feComposite in="l" in2="SourceAlpha" operator="in"/>
</filter>
<g id="shape"><path d="M16,1.5 L18.3,11 L25.5,6.5 L21,13.7 L30.5,16 L21,18.3 L25.5,25.5 L18.3,21 L16,30.5 L13.7,21 L6.5,25.5 L11,18.3 L1.5,16 L11,13.7 L6.5,6.5 L13.7,11 Z"/></g>
</defs>

<use xlink:href="#shape" fill="#0a0500" stroke="#0a0500" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<g filter="url(#bevel)"><use xlink:href="#shape" fill="url(#gold)"/></g>
<circle cx="16" cy="16" r="3" fill="#fffbe8" stroke="#6a2800" stroke-width=".8"/>
</svg>
