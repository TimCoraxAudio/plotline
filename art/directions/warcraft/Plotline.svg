<!-- Warcraft: add-on icon. A chunky clasped tome, item-icon style: black field, object fills the frame. Original art, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
<defs>
<linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fa0a8"/><stop offset="1" stop-color="#145a66"/></linearGradient>
<linearGradient id="spine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e4650"/><stop offset="0.5" stop-color="#1c6e78"/><stop offset="1" stop-color="#0a3038"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c3c44"/><stop offset="1" stop-color="#062228"/></linearGradient>
<linearGradient id="pages" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4d2"/><stop offset="1" stop-color="#c8a86e"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset="0.45" stop-color="#f0b42c"/><stop offset="1" stop-color="#8a4c08"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e83a2a"/><stop offset="1" stop-color="#7a0c08"/></linearGradient>
</defs>

<rect width="64" height="64" fill="#000"/>
<g stroke="#000" stroke-width="1.4" stroke-linejoin="round">
  <!-- spine (binding), front-left -->
  <path d="M3,25 L28,42 L28,58 L3,41 Z" fill="url(#spine)"/>
  <!-- bottom board under the pages -->
  <path d="M28,55 L61,35 L61,39 L28,59 Z" fill="url(#edge)"/>
  <!-- page block, front-right -->
  <path d="M28,45 L59,26.5 L59,36.5 L28,55 Z" fill="url(#pages)"/>
  <!-- top board edge -->
  <path d="M28,42 L61,22 L61,26 L28,46 Z" fill="url(#edge)"/>
  <!-- cover -->
  <path d="M3,25 L35,6 L61,22 L28,42 Z" fill="url(#cover)"/>
</g>
<!-- page lines -->
<g stroke="#a88650" stroke-width=".6"><path d="M29,47.5 L58,30"/><path d="M29,50 L58,32.5"/><path d="M29,52.5 L58,35"/></g>
<!-- painted light on the cover: hard-edged, not airbrushed -->
<path d="M6,25 L35,8 L44,13.5 L15,30.5 Z" fill="#6fd4d0" opacity=".35"/>
<path d="M8,25 L35,9 L37.5,10.5 L10.5,26.5 Z" fill="#c8fff4" opacity=".45"/>
<!-- spine bands -->
<g stroke="#000" stroke-width="1" fill="url(#gold)">
  <path d="M9,29 L13,31.7 L13,47.7 L9,45 Z"/><path d="M18,35 L22,37.7 L22,53.7 L18,51 Z"/>
</g>
<!-- heavy corner caps with rivets -->
<g stroke="#000" stroke-width="1.2" stroke-linejoin="round" fill="url(#gold)">
  <path d="M3,25 L12,19.6 L12.5,23.5 L7.5,26.5 L11,29 L7,31.5 L3,28.5 Z"/>
  <path d="M35,6 L44,11.5 L40.5,13.5 L35,10 L29.5,13.3 L26,11.2 Z"/>
  <path d="M61,22 L61,26 L52,31.5 L48.5,29.3 L56.5,24.5 L52,21.8 L55.5,19.7 Z"/>
  <path d="M28,42 L28,46 L19,40.5 L22,38.5 L28,42 Z"/>
</g>
<g fill="#fff8d0"><circle cx="7" cy="27.2" r=".9"/><circle cx="35" cy="8.4" r=".9"/><circle cx="57" cy="22.6" r=".9"/></g>
<!-- clasp over the page block -->
<path d="M42,34 L47,31 L47.5,41.5 L42.5,44.5 Z" fill="url(#gold)" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="45" cy="38" r="1.3" fill="#7a3c06" stroke="#000" stroke-width=".6"/>
<!-- emblem: a winding line with three steps, embossed in gold -->
<ellipse cx="32" cy="24" rx="10" ry="6" fill="#0c3c44" stroke="#000" stroke-width="1"/>
<ellipse cx="32" cy="24" rx="10" ry="6" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
<path d="M24.5,26 C27.5,22 30,27.5 32.5,24 C35,20.5 37,25 39.5,21.5" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"/>
<path d="M24.5,26 C27.5,22 30,27.5 32.5,24 C35,20.5 37,25 39.5,21.5" fill="none" stroke="#ffd860" stroke-width="1.3" stroke-linecap="round"/>
<g fill="#ffe890" stroke="#000" stroke-width=".7"><circle cx="24.5" cy="26" r="1.5"/><circle cx="32.5" cy="24" r="1.5"/><circle cx="39.5" cy="21.5" r="1.7"/></g>
<!-- ribbon bookmark -->
<path d="M34,52 L38,49.5 L39,61 L36.5,58.5 L34.8,62.5 Z" fill="url(#ribbon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<!-- glints -->
<g fill="#fff"><path d="M12,21 l.8,-2 l.8,2 l2,.8 l-2,.8 l-.8,2 l-.8,-2 l-2,-.8 Z"/><path d="M45,30.5 l.6,-1.5 l.6,1.5 l1.5,.6 l-1.5,.6 l-.6,1.5 l-.6,-1.5 l-1.5,-.6 Z"/></g>
</svg>
