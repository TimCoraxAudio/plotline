<defs>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a0"/><stop offset="0.4" stop-color="#d8a230"/><stop offset="1" stop-color="#6a3c06"/></linearGradient><linearGradient id="disc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2016"/><stop offset="1" stop-color="#060402"/></linearGradient>
</defs>

<circle cx="32" cy="32" r="29" fill="url(#disc)"/>
<circle cx="32" cy="32" r="27" fill="none" stroke="#000" stroke-width="6"/>
