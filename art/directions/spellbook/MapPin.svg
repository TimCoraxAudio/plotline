<!-- Spellbook: map pin. A small tome inside a gold ring. Original art, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32">
<defs>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="0.5" stop-color="#c88a2c"/><stop offset="1" stop-color="#5a3008"/></linearGradient>
<radialGradient id="in" cx="50%" cy="35%" r="50%"><stop offset="0" stop-color="#4a3020"/><stop offset="1" stop-color="#0e0805"/></radialGradient>
<linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset="1" stop-color="#d8a860"/></linearGradient>
<filter id="bevel" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="2" diffuseConstant="1.2" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
 <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" result="sh"/>
 <feSpecularLighting in="b" surfaceScale="2" specularConstant="0.8" specularExponent="20" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="38"/></feSpecularLighting>
 <feComposite in="sh" in2="s" operator="arithmetic" k2="1" k3="1" result="l"/>
 <feComposite in="l" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>

<circle cx="16" cy="16" r="15" fill="#080402"/>
<circle cx="16" cy="16" r="13.5" fill="url(#ring)" filter="url(#bevel)"/>
<circle cx="16" cy="16" r="10" fill="url(#in)" stroke="#1a0c02" stroke-width=".8"/>
<ellipse cx="16" cy="15" rx="7" ry="5" fill="#ffc24a" opacity=".5" filter="url(#glow)"/>
<path d="M16,14 C13.5,12.5 10.5,12.5 8.5,13.5 L8.5,20 C10.5,19 13.5,19 16,20.5 C18.5,19 21.5,19 23.5,20 L23.5,13.5 C21.5,12.5 18.5,12.5 16,14 Z" fill="url(#page)" stroke="#3a2008" stroke-width=".6"/>
<path d="M16,14 V20.5" stroke="#7a4a1a" stroke-width=".6"/>
</svg>
