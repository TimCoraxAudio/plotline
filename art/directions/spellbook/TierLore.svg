<!-- Spellbook tier: Lore. A tome giving off light, with a rune. Original art, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32">
<defs>
<radialGradient id="bg" cx="45%" cy="35%" r="75%"><stop offset="0" stop-color="#ffb040"/><stop offset="0.35" stop-color="#b0500a"/><stop offset="1" stop-color="#1e0802"/></radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.65"/></radialGradient>
<linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset="1" stop-color="#d8a860"/></linearGradient>
<linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a1a3a"/><stop offset="1" stop-color="#22061a"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
<filter id="bevel" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="0.4" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="1.2" diffuseConstant="1.2" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
 <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" result="sh"/>
 <feSpecularLighting in="b" surfaceScale="1.2" specularConstant="0.4" specularExponent="20" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="38"/></feSpecularLighting>
 <feComposite in="sh" in2="s" operator="arithmetic" k2="1" k3="1" result="l"/>
 <feComposite in="l" in2="SourceAlpha" operator="in"/>
</filter>
</defs>
<rect width="32" height="32" fill="url(#bg)"/>

<circle cx="16" cy="11" r="8" fill="#ffd27a" opacity=".7" filter="url(#glow)"/>
<g filter="url(#bevel)">
  <path d="M16,20 C11,17.5 6,17.5 2.5,19 L2.5,29 C6,27.5 11,27.5 16,30 C21,27.5 26,27.5 29.5,29 L29.5,19 C26,17.5 21,17.5 16,20 Z" fill="url(#cover)"/>
  <path d="M16,19 C12,16.5 7.5,16.5 4,17.8 L4,27 C7.5,25.8 12,25.8 16,28 C20,25.8 24.5,25.8 28,27 L28,17.8 C24.5,16.5 20,16.5 16,19 Z" fill="url(#page)"/>
</g>
<path d="M16,19 V28" stroke="#7a4a1a" stroke-width=".8"/>
<g fill="none" stroke-linecap="round">
  <path d="M16,4 V15 M16,9 L12,5.5 M16,9 L20,5.5" stroke="#ffb02a" stroke-width="3" filter="url(#glow)"/>
  <path d="M16,4 V15 M16,9 L12,5.5 M16,9 L20,5.5" stroke="#fffaf0" stroke-width="1.3"/>
</g>
<rect width="32" height="32" fill="url(#vig)"/><rect x=".75" y=".75" width="30.5" height="30.5" fill="none" stroke="#000" stroke-opacity=".85" stroke-width="1.5"/><path d="M1.5,30.5 V1.5 H30.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width=".8"/>
</svg>
